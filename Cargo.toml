[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/shell",
    "crates/render",
    "crates/app",
]

# ---------------------------------------------------------------------------
# 快速迭代 profile：日常开发用 `cargo build --profile dev-fast`
# 目标：改一行代码后重编只要几百毫秒级，同时运行时表现接近 release。
#   - 依赖（windows-rs / D2D / WinRT 等重型泛型代码）按 opt-level 3 编译，
#     但只编译一次，之后改业务代码不会触发它们重编；
#   - 本工作区代码 opt-level 1 + incremental，重编极快；
#   - debug = false 砍掉调试信息，链接耗时大幅下降（debuginfo 是链接大头）；
#   - debug-assertions = false 使 `#![cfg_attr(not(debug_assertions), ...)]` 生效，
#     产出与 release 一致的无控制台窗口行为（日志仍写入 data/logs 滚动文件）。
# 注意：这是纯新增 profile，`cargo build` / `cargo build --release` / CI 行为完全不变。
# ---------------------------------------------------------------------------
[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = false
debug-assertions = false
incremental = true
codegen-units = 256
lto = false

[profile.dev-fast.package."*"]
opt-level = 3

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# 共享依赖：各 crate 通过 `workspace = true` 引用，保证版本唯一。
[workspace.dependencies]
winbosk-core = { path = "crates/core" }
winbosk-shell = { path = "crates/shell" }
winbosk-render = { path = "crates/render" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
crossbeam-channel = "0.5.16"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"

# windows-rs 功能集：随各里程碑按需增补。
# M1: 壳层接管 + 图标枚举提取 + Win32 渲染基础（D3D11/DXGI/D2D/DWrite/GDI/DWM）
# windows-numerics：D2D/合成的矩阵与向量类型（Matrix3x2 / Vector2 / Vector3）所在 crate，
# windows crate 内引用它但不在自己的公开路径重导出，需显式声明才能构造。
windows-numerics = "0.3.1"
# implement! 宏生成的 COM/WinRT 实现引用 `::windows_core::` 路径，需显式声明。
windows-core = "0.62.2"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Globalization",
    # M7: WinRT Windows.UI.Composition（真·实时 BackdropBlur）
    # DispatcherQueue（Compositor::new 前置要求）+ 合成器/效果/绘制表面互操作
    "System",
    "Foundation",
    "Foundation_Numerics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
