<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>04 · 桌面栅栏 Overlay · 玻璃拟态</title>
<style>
  :root {
    --ink: #f4f7ff;
    --muted: rgba(235,240,255,.55);
    --line: rgba(255,255,255,.14);
    --glass: rgba(255,255,255,.10);
    --glass-hi: rgba(255,255,255,.16);
    --accent: #8eb6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    min-height: 100vh;
    color: var(--ink);
    background: #0b1020;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  .monitor {
    width: min(1100px, 100%);
    aspect-ratio: 16/10;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 40px 100px rgba(0,0,0,.6);
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(800px 500px at 65% 30%, #3d5a8c 0%, transparent 55%),
      radial-gradient(600px 400px at 20% 70%, #1a3a4a 0%, transparent 50%),
      linear-gradient(145deg, #1e2a44 0%, #0d1322 55%, #152038 100%);
  }
  .monitor::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: .4;
    pointer-events: none;
  }
  /* taskbar */
  .taskbar {
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    padding: 6px 12px;
    background: rgba(20,24,40,.75);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    z-index: 5;
  }
  .taskbar i {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: linear-gradient(145deg, #6a7a9a, #3e4a66);
    display: block;
  }
  .taskbar i:nth-child(2) { background: linear-gradient(145deg, #4a80d0, #2a5090); }
  .taskbar i:nth-child(3) { background: linear-gradient(145deg, #d07a4a, #904a2a); }
  .taskbar i:nth-child(4) { background: linear-gradient(145deg, #4ad09a, #2a9060); }

  /* fences */
  .fence {
    position: absolute;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(28px) saturate(1.4);
    box-shadow:
      0 16px 40px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.18);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .fence:hover {
    transform: translateY(-3px);
    box-shadow:
      0 24px 50px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.22),
      0 0 0 1px rgba(142,182,255,.35);
  }
  .fence .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .fence .bar strong {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .fence .bar .n {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    background: rgba(0,0,0,.25);
    border-radius: 999px;
    padding: 2px 7px;
  }
  .fence .bar .fold {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .fence .bar .fold:hover {
    background: rgba(255,255,255,.12);
    border-color: var(--line);
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 10px;
  }
  .grid.c3 { grid-template-columns: repeat(3, 1fr); }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: default;
    transition: background .12s, border-color .12s, transform .12s;
  }
  .app:hover {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.18);
    transform: scale(1.04);
  }
  .app .ic {
    width: 40px; height: 40px;
    border-radius: 11px;
    box-shadow: 0 4px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .app span {
    font-size: 10px;
    color: rgba(255,255,255,.85);
    text-align: center;
    line-height: 1.25;
    max-width: 64px;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    word-break: break-all;
  }
  .i1 { background: linear-gradient(145deg,#6ea8fe,#3b6fd4); }
  .i2 { background: linear-gradient(145deg,#ffb454,#d4782a); }
  .i3 { background: linear-gradient(145deg,#3ddc97,#1f9e6a); }
  .i4 { background: linear-gradient(145deg,#c792ea,#8b5fc7); }
  .i5 { background: linear-gradient(145deg,#ff7a90,#d43d5a); }
  .i6 { background: linear-gradient(145deg,#5fd0e8,#2a8aa8); }
  .i7 { background: linear-gradient(145deg,#f0e68c,#c0b04a); }
  .i8 { background: linear-gradient(145deg,#90a4ae,#546e7a); }

  /* positions */
  #f1 { left: 4%; top: 6%; width: 34%; }
  #f2 { right: 4%; top: 6%; width: 30%; }
  #f3 { left: 4%; top: 52%; width: 42%; }
  /* collapsed sidebar fence */
  #f4 {
    right: 5%; top: 48%;
    width: 56px; height: 42%;
    padding: 8px 6px;
    gap: 8px;
    align-items: center;
  }
  #f4 .tab {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    color: rgba(255,255,255,.85);
    margin-bottom: 4px;
  }
  #f4 .mini {
    width: 36px; height: 36px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
  }
  /* free icons zone */
  .free {
    position: absolute;
    left: 50%; top: 8%;
    transform: translateX(-10%);
    display: flex; gap: 10px;
    opacity: .7;
  }
  .free .app .ic { width: 34px; height: 34px; border-radius: 9px; }
  .free .app span { font-size: 9px; }

  .caption {
    position: absolute;
    left: 50%; bottom: 52px;
    transform: translateX(-50%);
    z-index: 6;
    font-size: 12px;
    color: rgba(255,255,255,.55);
    background: rgba(0,0,0,.35);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .legend {
    width: min(1100px, 100%);
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    color: rgba(255,255,255,.5);
    font-size: 12px;
  }
  .legend span {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 4px 12px;
  }
</style>
</head>
<body>
<div>
  <div class="monitor" role="img" aria-label="WinBosk 桌面栅栏玻璃 overlay 场景">
    <!-- free icons -->
    <div class="free" aria-hidden="true">
      <div class="app"><div class="ic i7"></div><span>便签</span></div>
      <div class="app"><div class="ic i8"></div><span>截图</span></div>
    </div>

    <!-- Fence: Projects -->
    <section class="fence" id="f1">
      <div class="bar">
        <strong>项目</strong>
        <span class="n">12</span>
        <button class="fold" aria-label="折叠">–</button>
      </div>
      <div class="grid">
        <div class="app"><div class="ic i1"></div><span>VS Code</span></div>
        <div class="app"><div class="ic i4"></div><span>Figma</span></div>
        <div class="app"><div class="ic i6"></div><span>终端</span></div>
        <div class="app"><div class="ic i3"></div><span>Git</span></div>
        <div class="app"><div class="ic i2"></div><span>浏览器</span></div>
        <div class="app"><div class="ic i5"></div><span>Postman</span></div>
        <div class="app"><div class="ic i7"></div><span>设计稿</span></div>
        <div class="app"><div class="ic i8"></div><span>本地盘</span></div>
      </div>
    </section>

    <!-- Fence: Tools -->
    <section class="fence" id="f2">
      <div class="bar">
        <strong>工具</strong>
        <span class="n">外部</span>
        <button class="fold" aria-label="折叠">–</button>
      </div>
      <div class="grid c3">
        <div class="app"><div class="ic i6"></div><span>7-Zip</span></div>
        <div class="app"><div class="ic i3"></div><span>Everything</span></div>
        <div class="app"><div class="ic i1"></div><span>PowerToys</span></div>
        <div class="app"><div class="ic i2"></div><span>WinRAR</span></div>
        <div class="app"><div class="ic i4"></div><span>Notepad++</span></div>
        <div class="app"><div class="ic i5"></div><span>ShareX</span></div>
      </div>
    </section>

    <!-- Fence: Docs list -->
    <section class="fence" id="f3">
      <div class="bar">
        <strong>文档 · 最近</strong>
        <span class="n">列表</span>
        <button class="fold" aria-label="折叠">–</button>
      </div>
      <div class="grid" style="grid-template-columns: repeat(6, 1fr); padding-top: 8px; padding-bottom: 12px;">
        <div class="app"><div class="ic i7"></div><span>周报.docx</span></div>
        <div class="app"><div class="ic i1"></div><span>方案.pptx</span></div>
        <div class="app"><div class="ic i3"></div><span>预算.xlsx</span></div>
        <div class="app"><div class="ic i4"></div><span>笔记.md</span></div>
        <div class="app"><div class="ic i6"></div><span>草图.fig</span></div>
        <div class="app"><div class="ic i8"></div><span>归档.zip</span></div>
      </div>
    </section>

    <!-- Collapsed sidebar -->
    <section class="fence" id="f4" aria-label="折叠的侧边栏栅栏">
      <div class="tab">游戏</div>
      <div class="mini i2"></div>
      <div class="mini i5"></div>
      <div class="mini i1"></div>
      <div class="mini i4"></div>
    </section>

    <div class="caption">玻璃模糊 · 磁吸边缘 · 悬停放大 · 折叠侧栏占位</div>

    <div class="taskbar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="legend">
    <span>SetWindowRgn 区域裁剪</span>
    <span>非栅栏区点击穿透</span>
    <span>Wallpaper Engine 共存</span>
    <span>空闲 0 主线程动画唤醒</span>
  </div>
</div>
</body>
</html>
