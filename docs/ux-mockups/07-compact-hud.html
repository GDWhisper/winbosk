<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>07 · 紧凑浮动 HUD · WinBosk</title>
<style>
  :root {
    --ink: #f2f4f8;
    --muted: rgba(230,235,245,.55);
    --line: rgba(255,255,255,.12);
    --glass: rgba(18,20,28,.78);
    --accent: #7dd3fc;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    min-height: 100vh;
    color: var(--ink);
    background: #0a0e18;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  .frame {
    width: min(1080px, 100%);
    aspect-ratio: 16/9;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 40px 90px rgba(0,0,0,.55);
    background:
      radial-gradient(700px 400px at 30% 40%, #243656 0%, transparent 55%),
      radial-gradient(500px 300px at 80% 70%, #1a2e3e 0%, transparent 50%),
      linear-gradient(160deg, #151c2e, #0a0e18);
  }
  /* simplified fences */
  .f {
    position: absolute;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(20px);
    padding: 12px;
    opacity: .55;
  }
  .f h4 { font-size: 12px; margin-bottom: 10px; color: rgba(255,255,255,.7); }
  .f .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .f .row i {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(145deg, #5a6a8a, #3a4560);
    display: block;
  }
  #fa { left: 4%; top: 8%; width: 36%; height: 38%; }
  #fb { right: 5%; top: 12%; width: 32%; height: 42%; }
  #fc { left: 8%; bottom: 12%; width: 50%; height: 30%; }

  /* HUD strip — bottom center */
  .hud {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(24px) saturate(1.3);
    box-shadow:
      0 16px 40px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.1);
    z-index: 10;
  }
  .hud .brand {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 8px;
    border-right: 1px solid var(--line);
    margin-right: 4px;
    font-size: 13px;
    font-weight: 600;
  }
  .hud .brand .logo {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, #7dd3fc, #818cf8);
    display: grid; place-items: center;
    font-size: 11px;
    color: #0a0e18;
    font-weight: 800;
  }
  .act {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 64px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .act .ico { font-size: 16px; line-height: 1; }
  .act:hover {
    background: rgba(255,255,255,.08);
    color: var(--ink);
    border-color: var(--line);
  }
  .act.on {
    background: rgba(125,211,252,.15);
    border-color: rgba(125,211,252,.4);
    color: var(--accent);
  }
  .hud .divider {
    width: 1px;
    height: 32px;
    background: var(--line);
    margin: 0 6px;
  }
  .hud .pill {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .hud .pill b { color: var(--ink); font-weight: 600; }

  /* mini toast above HUD */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    z-index: 9;
    background: rgba(18,20,28,.9);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--ink);
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 10px;
  }
  .toast .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .toast span { color: var(--muted); font-size: 12px; }

  .label {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 12px;
    color: rgba(255,255,255,.4);
    z-index: 5;
    letter-spacing: .04em;
  }
  .legend {
    width: min(1080px, 100%);
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    font-size: 12px;
    color: rgba(255,255,255,.5);
  }
  .legend span {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 4px 12px;
  }
  /* expand panel above HUD */
  .quick {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(8px);
    width: min(420px, 90%);
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(24px);
    padding: 14px;
    z-index: 8;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .quick.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .quick h5 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .quick .q {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%;
    font: inherit; font-size: 13px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .quick .q:hover { background: rgba(255,255,255,.07); border-color: var(--line); }
  .quick .q kbd {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: inherit;
  }
  .toast.hide { display: none; }
</style>
</head>
<body>
<div>
  <div class="frame">
    <div class="label">概念 · 悬浮条 HUD（始终可触达，不挡内容）</div>

    <div class="f" id="fa"><h4>项目</h4><div class="row"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="f" id="fb"><h4>工具</h4><div class="row"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="f" id="fc"><h4>文档</h4><div class="row"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

    <div class="toast" id="toast" role="status">
      <span class="dot"></span>
      已整理 8 个未分组项
      <span>撤销 Ctrl+Z</span>
    </div>

    <div class="quick" id="quick" aria-label="快速菜单">
      <h5>快速动作</h5>
      <button class="q">新建栅栏 <kbd>Ctrl N</kbd></button>
      <button class="q">一键整理 <kbd>Ctrl O</kbd></button>
      <button class="q">展开全部栅栏 <kbd>Ctrl ⇧ E</kbd></button>
      <button class="q">折叠全部栅栏 <kbd>Ctrl ⇧ C</kbd></button>
      <button class="q">切换桌面 <kbd>Ctrl D</kbd></button>
      <button class="q" style="color:#fca5a5">退出并恢复 <kbd>Ctrl ⇧ F10</kbd></button>
    </div>

    <div class="hud" role="toolbar" aria-label="WinBosk HUD">
      <div class="brand"><span class="logo">W</span>WinBosk</div>
      <button class="act on" id="btnPanel"><span class="ico">▦</span>面板</button>
      <button class="act" id="btnOrganize"><span class="ico">✦</span>整理</button>
      <button class="act" id="btnToggle"><span class="ico">◫</span>折叠</button>
      <button class="act" id="btnDesktop"><span class="ico">⇄</span>桌面</button>
      <div class="divider"></div>
      <button class="act" id="btnMore"><span class="ico">⋯</span>更多</button>
      <span class="pill" id="statPill"><b>12</b> 栅栏 · 已接管</span>
    </div>
  </div>

  <div class="legend">
    <span>底部居中 · 不挡编辑区</span>
    <span>单击切换 · 长按/更多展开</span>
    <span>与任务栏错层，避免遮挡</span>
    <span>可拖到边缘吸附（概念）</span>
  </div>
</div>
<script>
  const quick = document.getElementById('quick');
  const toast = document.getElementById('toast');
  document.getElementById('btnMore').addEventListener('click', () => {
    quick.classList.toggle('open');
    toast.classList.add('hide');
  });
  document.getElementById('btnOrganize').addEventListener('click', function() {
    document.querySelectorAll('.act').forEach(x => x.classList.remove('on'));
    this.classList.add('on');
    toast.classList.remove('hide');
    quick.classList.remove('open');
  });
  document.getElementById('btnPanel').addEventListener('click', function() {
    document.querySelectorAll('.act').forEach(x => x.classList.remove('on'));
    this.classList.add('on');
    quick.classList.remove('open');
  });
  document.getElementById('btnDesktop').addEventListener('click', function() {
    const on = this.classList.toggle('on');
    toast.querySelector('span.dot').style.background = on ? '#fbbf24' : '';
    toast.childNodes[1].textContent = on ? ' 已切到原始桌面 ' : ' 已整理 8 个未分组项 ';
    toast.classList.remove('hide');
  });
  document.getElementById('btnToggle').addEventListener('click', () => {
    toast.classList.remove('hide');
    toast.childNodes[1].textContent = ' 已折叠全部栅栏 ';
  });
  document.querySelectorAll('.quick .q').forEach(q => {
    q.addEventListener('click', () => {
      quick.classList.remove('open');
      toast.classList.remove('hide');
      toast.childNodes[1].textContent = ' ' + q.textContent.replace(/Ctrl.*$/, '').trim() + ' ';
    });
  });
</script>
</body>
</html>
